# Railway config for the CRON service (a separate Railway service from the web service, same
# repo + root directory `backend`). Point this service's "Custom Config-as-code File" setting
# at `/backend/railway.cron.toml` explicitly -- Railway's config-as-code always overrides
# dashboard settings, and both services sharing root directory `backend` means the cron
# service would otherwise inherit `railway.toml`'s `uvicorn` startCommand, never exit, and
# (per Railway's own overlap-skip behavior) never run a second time. This file exists so that
# doesn't happen; do not delete it or fold it back into `railway.toml`.
#
# `python -m telogify.cli poll`, NOT the `telogify` console script: nixpacks' auto-detected
# install phase only runs `pip install -r requirements.txt`, never `pip install -e .`, so the
# `telogify` entry-point script setuptools would normally generate is never created on
# Railway. That's invisible for the web service, since `uvicorn telogify.api.main:app` is a
# plain module import off the working directory, not a call to an installed script -- this
# cron service is the first thing here to actually depend on that script existing, and it
# fails at the shell level before Python even starts (hence zero output in Deploy Logs on the
# first crashed run). `python -m telogify.cli` follows cli.py's own `if __name__ ==
# "__main__": app()` guard and needs nothing installed beyond what uvicorn already relies on.
#
# No year argument, so it never goes stale at a season boundary. Never --force: safe to call
# on a fixed schedule without redoing FastF1 ingest or re-spending LLM credits on rounds that
# haven't changed.

[build]
builder = "nixpacks"

[deploy]
startCommand = "python -m telogify.cli poll"
# Every 30 min, Thu through Mon (0,1,4,5,6 -- padded a day on each side of the Fri/Sat/Sun race
# weekend, as a buffer against UTC day-shift at tracks far from UTC and against a session
# running long). Not a single range: day-of-week wraps at Sunday (0), so a contiguous
# Thu-through-Mon span isn't expressible as "4-1" in a way that's portable across cron
# implementations -- the explicit list is unambiguous everywhere. All schedules are evaluated
# in UTC (Railway docs).
cronSchedule = "*/30 * * * 0,1,4,5,6"
# Deliberately no restartPolicyType here (unlike railway.toml's "on_failure"): a failing cron
# run should stay failed and visible in the logs, not restart-loop.
