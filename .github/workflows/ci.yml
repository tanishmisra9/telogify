name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telogify_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telogify_dev
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt && pip install -e .
      - name: Create the test database and migrate dev
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database telogify_test"
          alembic upgrade head              # a few pipeline tests read the real dev schema
      # The chip ink-metric test pins pixel widths measured on macOS; Linux's FreeType renders
      # ~2px differently, so it is skipped here. Run it locally.
      - run: pytest --deselect tests/test_email.py::test_dynamic_chip_ink_metrics_match_variant_c
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
